name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: bash ../tools/ci-run.sh "JavaScript (Node ${{ matrix.node }}) npm ci" npm ci
      - run: bash ../tools/ci-run.sh "JavaScript (Node ${{ matrix.node }}) npm test" npm test

  browser:
    name: JavaScript in a real browser (Chrome)
    runs-on: ubuntu-latest
    env:
      REQUIRE_BROWSER: "1"          # a missing Chrome is a failure here, not a skip
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: |
          bash ../tools/ci-run.sh "Browser tests: npm ci" npm ci
      - name: Browser tests
        env:
          CHROME_DUMPIO: "1"            # Chrome's own messages go into the output, to explain a failure to start
          CI_RUN_LINES: "120"
        run: >-
          bash ../tools/ci-run.sh "Browser tests"
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./browser/annotate.js --test-reporter-destination=stdout
          browser/*.spec.js

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 3.9 is the oldest version the package supports. GitHub has no Python 3.9 build
          # for the newest Ubuntu images, so it runs on an older one.
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: |
          bash ../tools/ci-run.sh "Python ${{ matrix.python }} on ${{ matrix.os }}: install" python -m pip install -e '.[test]'
        shell: bash
      - run: |
          bash ../tools/ci-run.sh "Python ${{ matrix.python }} on ${{ matrix.os }}: pytest" python -m pytest -v
        shell: bash
        env:
          CI_RUN_LINES: "150"

  package:
    name: Python package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          bash tools/ci-run.sh "Package: install build tools" python -m pip install build twine
      - run: |
          bash tools/ci-run.sh "Package: build" python -m build python
      - run: |
          bash tools/ci-run.sh "Package: twine check" python -m twine check python/dist/*
      - name: Install the built wheel and run it
        run: |
          bash tools/ci-run.sh "Package: install the wheel" python -m pip install python/dist/*.whl
          bash tools/ci-run.sh "Package: check the contact example" schmeditor examples/contact.schema.json examples/contact.json --check
          bash tools/ci-run.sh "Package: check the contact schema" schmeditor examples/editor-metaschema.json examples/contact.schema.json --check

  agreement:
    name: JavaScript and Python implementations agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          bash ../tools/ci-run.sh "Agreement: npm ci" npm ci
        working-directory: javascript
      - run: |
          bash tools/ci-run.sh "Agreement: install the package" python -m pip install -e python
      - run: |
          bash tools/ci-run.sh "Agreement: validators" python tools/compare_validators.py
      - run: |
          bash tools/ci-run.sh "Agreement: patches" python tools/compare_patches.py
