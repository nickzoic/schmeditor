name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 3.9 is the oldest version the package supports. GitHub has no Python 3.9 build
          # for the newest Ubuntu images, so it runs on an older one.
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v

  package:
    name: Python package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - name: Install the built wheel and run it
        run: |
          python -m pip install python/dist/*.whl
          schmeditor examples/contact.schema.json examples/contact.json --check
          schmeditor examples/editor-metaschema.json examples/contact.schema.json --check

  agreement:
    name: JavaScript and Python validators agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: javascript
      - run: python -m pip install -e python
      - run: python tools/compare_validators.py
